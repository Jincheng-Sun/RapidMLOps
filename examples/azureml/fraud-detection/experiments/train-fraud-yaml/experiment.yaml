# https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-pipeline?view=azureml-api-2
$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
name: train-fraud-yaml
display_name: train-fraud-yaml
experiment_name: train-fraud-yaml
tags:
  environment: dev

settings:
  default_compute: azureml:cpu-cluster
  default_datastore: azureml:workspaceblobstore
  force_rerun: true

inputs:
  training_data:
    type: uri_folder
    path: azureml:fraud-train-data@latest
  test_data:
    type: uri_folder
    path: azureml:fraud-test-data@latest
  test_labels:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/fraud-detection/input/test_labels
  registered_model_name: dummy-model-name

outputs:
  result_save_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/fraud-detection/output/result_save_path

jobs:
  prep_train_data:
    type: command
    component: azureml:prep-raw-data@latest
    inputs:
      raw_data: ${{ parent.inputs.training_data }}
  prep_test_data:
    type: command
    component: azureml:prep-raw-data@latest
    inputs:
      raw_data: ${{ parent.inputs.test_data }}
  train_linear_regression:
    type: command
    component: azureml:train-linear-regression@latest
    inputs:
      training_data: ${{ parent.jobs.prep_train_data.outputs.prepared_data }}
      test_data: ${{ parent.jobs.prep_test_data.outputs.prepared_data }}
      registered_model_name: ${{ parent.inputs.registered_model_name }}
  classification_evaluation:
    type: command
    component: azureml:classification-evaluation:1.0.0
    inputs:
      test_predictions: ${{ parent.jobs.train_linear_regression.outputs.test_predictions }}
      test_labels: ${{ parent.inputs.test_labels }}
    outputs:
      result_save_path: ${{ parent.outputs.result_save_path }}
