parameters:
  - name: environment
    type: string
  - name: dataName
    type: string
    default: ''
  - name: commitSha
    type: string
    default: ''
  - name: prId
    type: string
    default: ''
  - name: sourceBranch
    type: string
    default: ''
  - name: dataConfigFile
    type: string
    default: 'data.yaml'

steps:
  - script: |
      echo "Executing Dynamic Git Diff for Data Assets..."
      
      # Build the args
      CMD_ARGS="--environment ${{ parameters.environment }}"
      
      if [ -n "${{ parameters.dataName }}" ]; then
        CMD_ARGS="$CMD_ARGS --name ${{ parameters.dataName }}"
      fi
      if [ -n "${{ parameters.commitSha }}" ]; then
        CMD_ARGS="$CMD_ARGS --commit_sha ${{ parameters.commitSha }}"
      fi
      if [ -n "${{ parameters.prId }}" ]; then
        CMD_ARGS="$CMD_ARGS --pr_id ${{ parameters.prId }}"
      fi
      if [ -n "${{ parameters.sourceBranch }}" ]; then
        CMD_ARGS="$CMD_ARGS --source_branch ${{ parameters.sourceBranch }}"
      fi
      if [ -n "${{ parameters.dataConfigFile }}" ]; then
        CMD_ARGS="$CMD_ARGS --data_config_file ${{ parameters.dataConfigFile }}"
      fi
      
      # The python code executes exactly where the multi-checkout logic placed the rapidmlops template code!
      python $(Pipeline.Workspace)/s/rapidmlops/src/rapidmlops/azureml/data_asset/handler.py $CMD_ARGS
    displayName: 'Execute handler.py Git Orchestrator'