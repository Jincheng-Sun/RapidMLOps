$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: train-linear-regression
version: "default"
description: "Trains a linear regression model"
display_name: "Train Linear Regression"
type: command

inputs:
  training_data:
    type: uri_folder
    description: "Training data folder"
  test_data:
    type: uri_folder
    description: "Test data folder"
  registered_model_name:
    type: string
    description: "Registered model name"

outputs:
  test_predictions:
    type: uri_folder
    description: "Test predictions folder"
  

code: .
command: >
  python train_linear_regression.py 
  --training_data ${{ inputs.training_data }} 
  --test_data ${{ inputs.test_data }} 
  --registered_model_name ${{ inputs.registered_model_name }} 
  --test_predictions ${{ outputs.test_predictions }}

environment: azureml:sklearn-train-env@latest