parameters:
  - name: environment
    type: string
  - name: agentPool
    type: string
  - name: requirementsFile
    type: string
  - name: subscriptionId
    type: string
  - name: resourceGroup
    type: string
  - name: workspaceName
    type: string
  - name: commitSha
    type: string
    default: ''
  - name: prId
    type: string
    default: ''
  - name: sourceBranch
    type: string
    default: ''
  - name: environmentFolder
    type: string
    default: 'environments'
  - name: environmentConfigFile
    type: string
    default: 'environment.yaml'

jobs:
  - job: ProcessEnvironmentJob
    displayName: "Process Environment Job"
    pool: ${{ parameters.agentPool }}
    steps:
      - checkout: self
        clean: true
        path: s/
        fetchDepth: 0
      
      - checkout: RapidMLOps
        clean: true
        path: s/rapidmlops
        fetchTags: false
        fetchDepth: 0

      - template: ../steps/install-requirements.yaml
        parameters:
          environment: ${{ parameters.environment }}
          requirementsFile: ${{ parameters.requirementsFile }}

      - template: ../steps/setup-azureml.yaml
        parameters:
          subscriptionId: ${{ parameters.subscriptionId }}
          resourceGroup: ${{ parameters.resourceGroup }}
          workspaceName: ${{ parameters.workspaceName }}

      - template: ../steps/process-environment.yaml
        parameters:
          environment: ${{ parameters.environment }}
          commitSha: ${{ parameters.commitSha }}
          prId: ${{ parameters.prId }}
          sourceBranch: ${{ parameters.sourceBranch }}
          environmentFolder: ${{ parameters.environmentFolder }}
          environmentConfigFile: ${{ parameters.environmentConfigFile }}
